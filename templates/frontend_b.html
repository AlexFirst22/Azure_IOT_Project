<!--
=============================================================================
FRONTEND B — História prevodov
=============================================================================
Zadanie:
  ✅ Načíta históriu prevodov cez fetch() z /api/historia-prevodov
  ✅ Zobrazí ju v tabuľke (vstup, typ, výsledok, čas)

Komunikácia: GET request → /api/historia-prevodov → JSON → tabuľka
=============================================================================
-->
<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT História — Frontend B</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:         #0a0a0a;
            --surface:    #111111;
            --border:     rgba(255, 180, 0, 0.18);
            --amber:      #ffb400;
            --amber-dim:  rgba(255, 180, 0, 0.55);
            --amber-glow: rgba(255, 180, 0, 0.10);
            --text:       #e8dcc8;
            --muted:      #5a5040;
            --mono:       'Space Mono', monospace;
            --sans:       'DM Sans', sans-serif;
        }

        body {
            font-family: var(--sans);
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Animovaný canvas na pozadí */
        #bgCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .page-wrap {
            position: relative;
            z-index: 1;
            max-width: 820px;
            margin: 0 auto;
            animation: fadeIn 0.6s ease;
        }

        /* ── HLAVIČKA ── */
        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        .header h1 {
            font-family: var(--mono);
            font-size: 1.7em;
            font-weight: 700;
            color: var(--amber);
            text-shadow: 0 0 40px rgba(255,180,0,0.35);
        }

        /* ── STATUS PILL ── */
        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 6px 16px;
            font-family: var(--mono);
            font-size: 0.72em;
            color: var(--muted);
        }

        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--muted);
            flex-shrink: 0;
        }

        .dot.online  { background: #00e676; box-shadow: 0 0 8px rgba(0,230,118,0.5); animation: pulse 2s infinite; }
        .dot.offline { background: #ff5252; }

        .refresh-info {
            font-family: var(--mono);
            font-size: 0.68em;
            color: var(--muted);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.4; }
        }

        /* ── HLAVNÁ KARTA ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow:
                0 0 0 1px rgba(255,180,0,0.04),
                0 20px 60px rgba(0,0,0,0.55),
                inset 0 1px 0 rgba(255,255,255,0.03);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .card-title {
            font-family: var(--mono);
            font-size: 0.85em;
            color: var(--amber);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .count-badge {
            font-family: var(--mono);
            font-size: 0.7em;
            padding: 4px 12px;
            border-radius: 20px;
            background: var(--amber-glow);
            border: 1px solid var(--border);
            color: var(--amber-dim);
        }

        /* ── TABUĽKA ── */
        /* Zobrazuje históriu prevodov z /api/historia-prevodov */
        .tabulka {
            width: 100%;
            border-collapse: collapse;
        }

        .tabulka thead tr {
            border-bottom: 1px solid var(--border);
        }

        .tabulka th {
            font-family: var(--mono);
            font-size: 0.65em;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 0 12px 14px;
            text-align: left;
            font-weight: 400;
        }

        .tabulka th:last-child { text-align: right; }

        .tabulka tbody tr {
            border-bottom: 1px solid rgba(255,255,255,0.03);
            transition: background 0.2s;
        }

        .tabulka tbody tr:hover {
            background: rgba(255,180,0,0.03);
        }

        /* Animácia pre nové riadky */
        .tabulka tbody tr.new-row {
            animation: rowIn 0.4s ease;
        }

        @keyframes rowIn {
            from { opacity: 0; background: rgba(255,180,0,0.08); }
            to   { opacity: 1; background: transparent; }
        }

        .tabulka td {
            padding: 14px 12px;
            font-size: 0.9em;
            vertical-align: middle;
        }

        /* Stĺpec: Vstup */
        .td-vstup {
            font-family: var(--mono);
            font-size: 1em !important;
            font-weight: 700;
            color: var(--text);
        }

        /* Stĺpec: Typ prevodu */
        .typ-chip {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
            font-family: var(--mono);
            font-size: 0.72em;
            background: var(--amber-glow);
            border: 1px solid rgba(255,180,0,0.15);
            color: var(--amber-dim);
            white-space: nowrap;
        }

        /* Stĺpec: Výsledok */
        .td-vysledok {
            font-family: var(--mono);
            font-weight: 700;
            font-size: 1.05em !important;
            color: var(--amber);
            text-align: right;
        }

        /* Stĺpec: Čas */
        .td-cas {
            font-family: var(--mono);
            font-size: 0.72em !important;
            color: var(--muted);
            text-align: right;
            white-space: nowrap;
        }

        /* ── PRÁZDNY STAV ── */
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }

        .empty-icon {
            font-size: 2.5em;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        .empty p {
            font-family: var(--mono);
            font-size: 0.8em;
            line-height: 1.8;
        }

        /* ── LOADING ── */
        .loading {
            text-align: center;
            padding: 40px;
            font-family: var(--mono);
            font-size: 0.8em;
            color: var(--muted);
        }

        .loading-dots span {
            display: inline-block;
            animation: dotBounce 1.2s ease-in-out infinite;
            font-size: 1.5em;
            color: var(--amber);
        }

        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotBounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
            40%            { transform: translateY(-6px); opacity: 1; }
        }

        /* ── CHYBA ── */
        .error-box {
            display: none;
            padding: 16px 20px;
            background: rgba(255,80,80,0.06);
            border: 1px solid rgba(255,80,80,0.2);
            border-radius: 10px;
            color: #ff7070;
            font-family: var(--mono);
            font-size: 0.8em;
        }

        /* ── ANIMÁCIE ── */
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .cursor {
            display: inline-block;
            width: 2px; height: 1em;
            background: var(--amber);
            margin-left: 4px;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="page-wrap">

        <!-- ── HLAVIČKA ── -->
        <div class="header">
            <h1>História prevodov<span class="cursor"></span></h1>

            <div class="status-row">
                <div class="status-pill">
                    <span class="dot" id="statusDot"></span>
                    <span id="statusText">Načítavam...</span>
                </div>
                <div class="refresh-info" id="refreshInfo">—</div>
            </div>
        </div>

        <!-- ── KARTA S TABUĽKOU ── -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">Záznamy prevodov</span>
                <span class="count-badge" id="countBadge">0 záznamov</span>
            </div>

            <!-- Chyba -->
            <div class="error-box" id="errorBox">
                &#9888; Nepodarilo sa načítať dáta zo servera.
            </div>

            <!-- Obsah tabuľky -->
            <div id="tabulkaWrap">
                <div class="loading">
                    <div class="loading-dots">
                        <span>&#9632;</span><span>&#9632;</span><span>&#9632;</span>
                    </div>
                    <p style="margin-top: 12px;">Načítavam dáta...</p>
                </div>
            </div>

        </div>

    </div>

    <!-- ══════════════════════════════════════════════════════════
         JAVASCRIPT
         ══════════════════════════════════════════════════════════ -->
    <script>
    // ── KONFIGURÁCIA ──
    const BACKEND_URL = window.location.origin;

    // Mapovanie typov prevodov na čitateľné názvy
    const TYPY = {
        'c_to_f':      '°C → °F',
        'hpa_to_mmhg': 'hPa → mmHg',
        'ms_to_kmh':   'm/s → km/h'
    };

    // ─────────────────────────────────────────────────────────────
    // ANIMOVANÝ CANVAS — rovnaký efekt ako Frontend A
    // ─────────────────────────────────────────────────────────────
    const canvas = document.getElementById('bgCanvas');
    const ctx    = canvas.getContext('2d');
    let W, H, dots;

    function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }

    function initDots(count = 55) {
        dots = Array.from({ length: count }, () => ({
            x:  Math.random() * W,
            y:  Math.random() * H,
            vx: (Math.random() - 0.5) * 0.4,
            vy: (Math.random() - 0.5) * 0.4,
            r:  Math.random() * 1.5 + 0.5
        }));
    }

    function drawFrame() {
        ctx.clearRect(0, 0, W, H);
        dots.forEach(d => {
            d.x += d.vx; d.y += d.vy;
            if (d.x < 0 || d.x > W) d.vx *= -1;
            if (d.y < 0 || d.y > H) d.vy *= -1;
        });
        const MAX = 130;
        for (let i = 0; i < dots.length; i++) {
            for (let j = i + 1; j < dots.length; j++) {
                const dx = dots[i].x - dots[j].x;
                const dy = dots[i].y - dots[j].y;
                const d  = Math.sqrt(dx*dx + dy*dy);
                if (d < MAX) {
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(255,180,0,${(1 - d/MAX) * 0.18})`;
                    ctx.lineWidth = 0.8;
                    ctx.moveTo(dots[i].x, dots[i].y);
                    ctx.lineTo(dots[j].x, dots[j].y);
                    ctx.stroke();
                }
            }
        }
        dots.forEach(d => {
            ctx.beginPath();
            ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,180,0,0.5)';
            ctx.fill();
        });
        requestAnimationFrame(drawFrame);
    }

    resize(); initDots(); drawFrame();
    window.addEventListener('resize', () => { resize(); initDots(); });

    // ─────────────────────────────────────────────────────────────
    // NAČÍTANIE HISTÓRIE PREVODOV
    // Volá endpoint /api/historia-prevodov — vracia JSON zoznam
    // ─────────────────────────────────────────────────────────────
    async function nacitajHistoriu() {
        try {
            const response = await fetch(`${BACKEND_URL}/api/historia-prevodov`);
            const data     = await response.json();

            aktualizujStatus(true);
            zobrazTabulku(data);

        } catch (err) {
            console.error('Chyba:', err);
            aktualizujStatus(false);
            document.getElementById('tabulkaWrap').innerHTML = '';
            document.getElementById('errorBox').style.display = 'block';
        }
    }

    // ── AKTUALIZÁCIA STATUS INDIKÁTORA ──
    function aktualizujStatus(online) {
        const dot  = document.getElementById('statusDot');
        const text = document.getElementById('statusText');
        const info = document.getElementById('refreshInfo');

        dot.className  = 'dot ' + (online ? 'online' : 'offline');
        text.textContent = online ? 'Pripojené' : 'Chyba pripojenia';
        info.textContent = 'Posledná aktualizácia: ' + new Date().toLocaleTimeString('sk-SK');
    }

    // ── ZOBRAZENIE TABUĽKY ──
    // Prijme JSON pole zo /api/historia-prevodov a vykreslí tabuľku
    function zobrazTabulku(data) {
        const wrap = document.getElementById('tabulkaWrap');
        const countBadge = document.getElementById('countBadge');

        // Aktualizujeme počet záznamov
        countBadge.textContent = `${data.length} ${data.length === 1 ? 'záznam' : 'záznamov'}`;

        // Prázdny stav — ak ešte neboli žiadne prevody
        if (!data || data.length === 0) {
            wrap.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">&#9650;</div>
                    <p>Zatiaľ žiadne prevody.<br>Použite Frontend A na zadanie hodnoty.</p>
                </div>
            `;
            return;
        }

        // Zostavenie HTML tabuľky
        // Stĺpce: Vstup | Typ | Výsledok | Čas
        let html = `
            <table class="tabulka">
                <thead>
                    <tr>
                        <th>Vstup</th>
                        <th>Typ prevodu</th>
                        <th style="text-align:right">Výsledok</th>
                        <th style="text-align:right">Čas</th>
                    </tr>
                </thead>
                <tbody>
        `;

        // Zoradíme od najnovšieho (prevody.json má chronologické poradie)
        const zoradene = [...data].reverse();

        zoradene.forEach((item, index) => {
            const typLabel = TYPY[item.typ] || item.typ;
            const isNew    = index === 0 ? 'new-row' : '';

            html += `
                <tr class="${isNew}">
                    <td class="td-vstup">${item.hodnota}</td>
                    <td><span class="typ-chip">${typLabel}</span></td>
                    <td class="td-vysledok">${item.vysledok}</td>
                    <td class="td-cas">${item.cas}</td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        wrap.innerHTML = html;
    }

    // ── SPUSTENIE ──
    // Načítame hneď + automaticky každých 5 sekúnd (polling)
    nacitajHistoriu();
    setInterval(nacitajHistoriu, 8000);
    </script>

</body>
</html>
